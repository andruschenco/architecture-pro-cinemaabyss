{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.proxyService.name | default "proxy-service" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.proxyService.name | default "proxy-service" }}
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.proxyService.name | default "proxy-service" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Values.proxyService.name | default "proxy-service" }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .name }}
      {{- end }}
      containers:
        - name: {{ .Values.proxyService.name | default "proxy-service" }}
          image: "{{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}"
          imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxyService.service.targetPort }}
          env:
            - name: PORT
              value: "{{ .Values.proxyService.service.targetPort }}"
            - name: MONOLITH_URL
              value: "http://monolith:8888"
            - name: MOVIES_SERVICE_URL
              value: "http://movies-service:8081"
            - name: EVENTS_SERVICE_URL
              value: "http://events-service:80"
            - name: GRADUAL_MIGRATION
              value: "true"
            - name: MOVIES_MIGRATION_PERCENT
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: MOVIES_MIGRATION_PERCENT
          resources:
            limits:
              cpu: {{ .Values.proxyService.resources.limits.cpu }}
              memory: {{ .Values.proxyService.resources.limits.memory }}
            requests:
              cpu: {{ .Values.proxyService.resources.requests.cpu }}
              memory: {{ .Values.proxyService.resources.requests.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxyService.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxyService.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.proxyService.name | default "proxy-service" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.proxyService.name | default "proxy-service" }}
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.proxyService.service.type }}
  selector:
    app: {{ .Values.proxyService.name | default "proxy-service" }}
  ports:
    - protocol: TCP
      port: {{ .Values.proxyService.service.port }}
      targetPort: {{ .Values.proxyService.service.targetPort }}
  {{- end }}